---
- name: Distribute Juju controller public key to all nodes
  hosts: all
  become: true
  gather_facts: false

  vars:
    ssh_dir: "/home/{{ ssh_user }}/.ssh"
    authorized_keys_file: "{{ ssh_dir }}/authorized_keys"
    juju_pubkey_src: "/home/{{ ssh_user }}/.ssh/id_juju.pub"

  tasks:
    - name: Check if Juju public key exists on controller
      delegate_to: localhost
      ansible.builtin.stat:
        path: "{{ juju_pubkey_src }}"
      register: juju_key_stat

    - name: Fail if Juju public key not found
      delegate_to: localhost
      ansible.builtin.fail:
        msg: "Juju public key not found at {{ juju_pubkey_src }} on controller."
      when: not juju_key_stat.stat.exists

    - name: Read Juju public key from controller
      delegate_to: localhost
      ansible.builtin.slurp:
        src: "{{ juju_pubkey_src }}"
      register: juju_pubkey_content
      when: juju_key_stat.stat.exists

    - name: Ensure .ssh directory exists on node
      ansible.builtin.file:
        path: "{{ ssh_dir }}"
        state: directory
        owner: "{{ ssh_user }}"
        group: "{{ ssh_user }}"
        mode: '0700'

    - name: Ensure authorized_keys exists on node
      ansible.builtin.file:
        path: "{{ authorized_keys_file }}"
        state: touch
        owner: "{{ ssh_user }}"
        group: "{{ ssh_user }}"
        mode: '0600'

    - name: Add Juju public key to authorized_keys
      ansible.builtin.lineinfile:
        path: "{{ authorized_keys_file }}"
        line: "{{ juju_pubkey_content.content | b64decode | trim }}"
        state: present
        create: yes
        owner: "{{ ssh_user }}"
        group: "{{ ssh_user }}"
        mode: '0600'

    - name: Verify Juju key installation
      ansible.builtin.shell: grep -F "$(echo {{ juju_pubkey_content.content | b64decode | trim | quote }})" {{ authorized_keys_file }} && echo "Juju key present" || echo "Missing"
      register: juju_key_check
      changed_when: false

    - name: Show verification result
      ansible.builtin.debug:
        msg: "Node {{ inventory_hostname }}: {{ juju_key_check.stdout }}"
