default-base: ubuntu@24.04/stable

machines:
  "0": {}   # ck8s-1
  "1": {}   # ck8s-2

applications:
  easyrsa:
    charm: easyrsa
    channel: latest/stable
    num_units: 1
    to:
      - "0"

  etcd:
    charm: etcd
    channel: latest/stable
    num_units: 1
    to:
      - "0"
    options:
      channel: 3.4/stable

  kubernetes-control-plane:
    charm: kubernetes-control-plane
    channel: latest/stable
    num_units: 1
    to:
      - "0"
    options:
      channel: 1.33/stable

  kubernetes-worker:
    charm: kubernetes-worker
    channel: latest/stable
    num_units: 1
    to:
      - "1"
    options:
      channel: 1.33/stable
    expose: true

  containerd:
    charm: containerd
    channel: latest/stable

  calico:
    charm: calico
    channel: latest/stable
    options:
      vxlan: Always

relations:
  - ["kubernetes-control-plane:certificates", "easyrsa:client"]
  - ["etcd:certificates", "easyrsa:client"]
  - ["kubernetes-control-plane:etcd", "etcd:db"]
  - ["kubernetes-control-plane:kube-control", "kubernetes-worker:kube-control"]
  - ["kubernetes-worker:certificates", "easyrsa:client"]
  - ["calico:etcd", "etcd:db"]
  - ["calico:cni", "kubernetes-control-plane:cni"]
  - ["calico:cni", "kubernetes-worker:cni"]
  - ["containerd:containerd", "kubernetes-worker:container-runtime"]
  - ["containerd:containerd", "kubernetes-control-plane:container-runtime"]
